<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Economic Vision Admin API</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --ok: #34d399;
        --warn: #fbbf24;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: radial-gradient(circle at top left, #1e293b, var(--bg));
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(640px, 100%);
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.8rem;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.5;
      }

      .status {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 10px;
        background: #0b1220;
        margin-bottom: 12px;
      }

      .label {
        color: var(--muted);
      }

      .value {
        font-weight: 600;
      }

      .connected {
        color: var(--ok);
      }

      .disconnected,
      .unknown {
        color: var(--warn);
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Economic Vision Admin API</h1>
      <p>
        Node.js API with MongoDB is running. Use
        <a href="/api/health">/api/health</a> to check service status.
      </p>
      <div class="status">
        <span class="label">API</span>
        <span class="value connected">online</span>
      </div>
      <div class="status">
        <span class="label">MongoDB</span>
        <span id="mongo-status" class="value">checking...</span>
      </div>
    </main>
    <script>
      async function loadHealth() {
        const statusEl = document.getElementById("mongo-status");
        try {
          const response = await fetch("/api/health");
          const data = await response.json();
          statusEl.textContent = data.mongodb;
          statusEl.className = `value ${
            data.mongodb === "connected" ? "connected" : "disconnected"
          }`;
        } catch (error) {
          statusEl.textContent = "unavailable";
          statusEl.className = "value unknown";
        }
      }

      loadHealth();
    </script>
  </body>
</html>
